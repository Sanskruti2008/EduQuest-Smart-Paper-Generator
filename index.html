<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EduQuest – Smart Question Paper Generator for creating, managing, and reviewing question papers." />
    <title>EduQuest – Smart Question Paper Generator</title>
    <script>
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('eduquest-theme');
        } catch (error) {
          // Fall back to the operating-system preference when storage is unavailable.
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.toggle('dark', theme === 'dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
